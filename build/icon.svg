<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/>
      <stop offset="1" stop-color="#4a36d8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="lensShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1a1060" flood-opacity="0.45"/>
    </filter>
    <clipPath id="lensClip"><circle cx="590" cy="545" r="142"/></clipPath>
  </defs>

  <!-- macOS icon grid: 824px body inset 100px -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>

  <!-- left pane: base -->
  <rect x="196" y="236" width="300" height="540" rx="34" fill="#fff" fill-opacity="0.14"/>
  <g fill="#fff" fill-opacity="0.6">
    <rect x="232" y="286" width="190" height="26" rx="13"/>
    <rect x="232" y="346" width="226" height="26" rx="13"/>
    <rect x="232" y="586" width="160" height="26" rx="13"/>
    <rect x="232" y="646" width="210" height="26" rx="13"/>
    <rect x="232" y="706" width="130" height="26" rx="13"/>
  </g>
  <rect x="212" y="396" width="268" height="156" rx="16" fill="#ff5c7a" fill-opacity="0.32"/>
  <g fill="#ff8aa0">
    <rect x="232" y="412" width="200" height="26" rx="13"/>
    <rect x="232" y="472" width="150" height="26" rx="13"/>
  </g>

  <!-- right pane: head -->
  <rect x="528" y="236" width="300" height="540" rx="34" fill="#fff" fill-opacity="0.14"/>
  <g fill="#fff" fill-opacity="0.6">
    <rect x="564" y="286" width="190" height="26" rx="13"/>
    <rect x="564" y="346" width="226" height="26" rx="13"/>
    <rect x="564" y="646" width="210" height="26" rx="13"/>
    <rect x="564" y="706" width="130" height="26" rx="13"/>
  </g>
  <rect x="544" y="396" width="268" height="216" rx="16" fill="#3ddc97" fill-opacity="0.32"/>
  <g fill="#7af0bd">
    <rect x="564" y="412" width="220" height="26" rx="13"/>
    <rect x="564" y="472" width="170" height="26" rx="13"/>
    <rect x="564" y="532" width="200" height="26" rx="13"/>
  </g>

  <!-- lens -->
  <g filter="url(#lensShadow)">
    <line x1="700" y1="655" x2="808" y2="763" stroke="#fff" stroke-width="64" stroke-linecap="round"/>
    <circle cx="590" cy="545" r="162" fill="#3a2bb0"/>
    <g clip-path="url(#lensClip)">
      <rect x="430" y="470" width="320" height="150" fill="#3ddc97" fill-opacity="0.35"/>
      <rect x="470" y="492" width="250" height="40" rx="20" fill="#7af0bd"/>
      <rect x="470" y="560" width="190" height="40" rx="20" fill="#7af0bd"/>
      <rect x="430" y="400" width="320" height="300" fill="url(#shine)"/>
    </g>
    <circle cx="590" cy="545" r="162" fill="none" stroke="#fff" stroke-width="40"/>
  </g>
</svg>
