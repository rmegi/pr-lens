appId: dev.prlens.app
productName: PR Lens
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
icon: build/icon.png
extraResources:
  - from: build/icon.png
    to: icon.png
asarUnpack:
  - resources/**
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
linux:
  category: Development
  target: [AppImage, deb]
  maintainer: PR Lens
win:
  target: [nsis]
